# Railway — deploy bằng Dockerfile trong thư mục này (chạy `railway up` từ 06-lab-complete/)
# PORT do Railway cấp, CMD trong Dockerfile đã nghe theo ${PORT:-8000}.
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên Railway dashboard / `railway variables`, không ghi ở đây.

[build]
dockerfilePath = "Dockerfile"
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 100
