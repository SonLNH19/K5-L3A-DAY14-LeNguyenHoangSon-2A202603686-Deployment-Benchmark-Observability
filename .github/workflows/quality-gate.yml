# Exercise 7.3 — Quality gate: chạy eval trên golden dataset cho mỗi pull request.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy → job fail → PR bị chặn merge
# (bật "Require status checks to pass" cho job này trong Branch protection của GitHub).
name: quality-gate
on: [pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Start agent v2 (tắt lỗi ngẫu nhiên để eval ổn định)
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Eval quality gate (accuracy >= 85%)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85
